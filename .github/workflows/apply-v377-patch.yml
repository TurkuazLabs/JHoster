# 📄 Dosya Yolu: E:\JHoster\.github\workflows\apply-v377-patch.yml
# 📌 Amac: JHoster v3.77.0 patch paketini dogrular, test eder ve main branch'e uygular
# 📌 Modul - YAML
# Version: 3.77.0
# Aciklama: Gecici patch aktarim workflow'u; basarili test sonrasi kaynaklari commit eder ve kendini temizler
# Bagimli Oldugu Katman: Tool

name: Apply JHoster v3.77.0 Patch

on:
  push:
    branches:
      - main
    paths:
      - ".import/v377-patch.b64"

permissions:
  contents: write

jobs:
  apply-v377:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Decode and validate patch
        shell: bash
        run: |
          set -euo pipefail
          test -s .import/v377-patch.b64
          mkdir -p "$RUNNER_TEMP/jhoster-v377"
          base64 --decode .import/v377-patch.b64 > "$RUNNER_TEMP/jhoster-v377.tar.xz"
          xz -t "$RUNNER_TEMP/jhoster-v377.tar.xz"
          tar -tJf "$RUNNER_TEMP/jhoster-v377.tar.xz" > "$RUNNER_TEMP/jhoster-v377-files.txt"
          if grep -E '(^/|(^|/)\.\.(/|$))' "$RUNNER_TEMP/jhoster-v377-files.txt"; then
            echo "Unsafe archive path detected"
            exit 1
          fi
          FILE_COUNT="$(grep -v '/$' "$RUNNER_TEMP/jhoster-v377-files.txt" | wc -l | tr -d ' ')"
          echo "Patch file count: $FILE_COUNT"
          test "$FILE_COUNT" -ge 20
          test "$FILE_COUNT" -le 30

      - name: Apply patch files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jhoster-v377"
          FIRST_ROOT="$(head -n 1 "$RUNNER_TEMP/jhoster-v377-files.txt" | cut -d/ -f1)"
          UNIQUE_ROOTS="$(cut -d/ -f1 "$RUNNER_TEMP/jhoster-v377-files.txt" | sort -u | wc -l | tr -d ' ')"
          if [ "$UNIQUE_ROOTS" = "1" ] && [ "$FIRST_ROOT" = "JHoster" ]; then
            tar -xJf "$RUNNER_TEMP/jhoster-v377.tar.xz" -C "$RUNNER_TEMP/jhoster-v377" --strip-components=1
          else
            tar -xJf "$RUNNER_TEMP/jhoster-v377.tar.xz" -C "$RUNNER_TEMP/jhoster-v377"
          fi
          cp -a "$RUNNER_TEMP/jhoster-v377/." .

      - name: Install agent dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r app/agent/requirements.txt

      - name: Python compile
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app/agent

      - name: Provisioning smoke tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          TESTS=(app/agent/test-*provision*.py app/agent/test-*stack*.py)
          if [ "${#TESTS[@]}" -eq 0 ]; then
            echo "No Python provisioning test found"
            exit 1
          fi
          for test_file in "${TESTS[@]}"; do
            echo "Running $test_file"
            (
              cd app/agent
              python "$(basename "$test_file")"
            )
          done

      - name: API surface audit
        shell: bash
        run: |
          set -euo pipefail
          (
            cd app/agent
            python test-api-surface-audit.py
          )

      - name: Source header guard
        shell: bash
        run: |
          set -euo pipefail
          python app/desktop/test-source-header-path-guard.py

      - name: Maven compile
        shell: bash
        run: |
          set -euo pipefail
          mvn -q -f app/desktop/pom.xml -DskipTests compile

      - name: Clean generated files
        shell: bash
        run: |
          set -euo pipefail
          find app -type d -name __pycache__ -prune -exec rm -rf {} +
          find app -type f -name '*.pyc' -delete
          rm -rf app/desktop/target
          rm -f .import/v377-patch.b64
          rm -f .github/workflows/apply-v377-patch.yml

      - name: Commit verified v3.77.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 1
          fi
          git commit -m "feat: connect v3.77.0 stack provisioning plan [skip ci]"
          git push origin HEAD:main
