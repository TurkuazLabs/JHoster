# 📄 Dosya Yolu: E:\JHoster\.github\workflows\import-jhoster-v3.76.1.yml
# 📌 Amac: JHoster v3.76.1 kaynak paketini GitHub main branch uzerine acar ve gecici import dosyalarini temizler
# 📌 Tool - YAML
# Version: 3.76.1
# Aciklama: SHA256 dogrulamali tek seferlik kaynak import workflow'u
# Bagimli Oldugu Katman: Tool

name: Import JHoster v3.76.1 Source

on:
  push:
    branches:
      - main
    paths:
      - ".import/jhoster_v3761.tar.xz"
      - ".github/workflows/import-jhoster-v3.76.1.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          echo "610e36396c514642419da7e76f7d7739f75decd54a9056c5a3fb229ac75378d3  .import/jhoster_v3761.tar.xz" | sha256sum -c -

      - name: Import source tree
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .import/unpack
          mkdir -p .import/unpack
          tar -xJf .import/jhoster_v3761.tar.xz -C .import/unpack

          find . -mindepth 1 -maxdepth 1             ! -name ".git"             ! -name ".github"             ! -name ".import"             -exec rm -rf {} +

          shopt -s dotglob nullglob
          for entry in .import/unpack/*; do
            cp -a "$entry" .
          done

          rm -rf .import
          rm -f .github/workflows/import-jhoster-v3.76.1.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "feat: import JHoster v3.76.1 source"
          git push origin HEAD:main
