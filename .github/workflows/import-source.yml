# 📄 Dosya Yolu: E:\JHoster\.github\workflows\import-source.yml
# 📌 Amac: JHoster v3.76.1 kaynak paketini gecici binary parcalardan acip main branch'e aktarir
# 📌 Modul - YAML
# Version: 3.76.1
# Aciklama: Tek seferlik kaynak import workflow'u
# Bagimli Oldugu Katman: Tool

name: Import JHoster Source

on:
  push:
    branches:
      - main
    paths:
      - ".import/**"
      - ".github/workflows/import-source.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .import/source-*.bin > /tmp/jhoster-source.tar.xz
          echo "71fdf6af42ccb670f504dd08f033bece1ecf1e205e4c4eaa79e966f3fe900509  /tmp/jhoster-source.tar.xz" | sha256sum -c -

      - name: Extract full source tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .import -exec rm -rf {} +
          tar -xJf /tmp/jhoster-source.tar.xz -C .
          rm -rf .import
          rm -f .github/workflows/import-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import JHoster v3.76.1 source"
          git push origin HEAD:main
