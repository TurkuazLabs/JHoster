# 📄 Dosya Yolu: E:\JHoster\.github\workflows\import-v3.76.1.yml
# 📌 Amac: Gecici import branch'indeki parcalari birlestirip temiz JHoster kaynak agacini main branch'e aktarir
# 📌 Modul - YAML
# Version: 3.76.1
# Aciklama: Base64 ZIP parcalarini dogrular, acar, orphan commit olusturur ve main branch'e kaynak agaci olarak yazar
# Bagimli Oldugu Katman: Tool

name: Import JHoster v3.76.1

on:
  push:
    branches:
      - import-v3.76.1
    paths:
      - .import/READY

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    env:
      IMPORT_DIR: .import
      ARCHIVE_NAME: JHoster_v3.76.1_source_header_roadmap_patch.zip
      EXPECTED_SHA256: ee7002ab39ccbd417eae512fe08fc189372406f3cdf4a42044bac1002a5ccc47
      SOURCE_DIR: JHoster
      TARGET_BRANCH: main
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild archive
        shell: bash
        run: |
          set -euo pipefail
          cat "$IMPORT_DIR"/parts/part-*.b64 > "$RUNNER_TEMP/archive.b64"
          base64 --decode "$RUNNER_TEMP/archive.b64" > "$RUNNER_TEMP/$ARCHIVE_NAME"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/$ARCHIVE_NAME" | sha256sum --check

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q "$RUNNER_TEMP/$ARCHIVE_NAME" -d "$RUNNER_TEMP/source"
          test -d "$RUNNER_TEMP/source/$SOURCE_DIR"

      - name: Build clean main commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JHoster Import Bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan jhoster-v3.76.1-clean
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$RUNNER_TEMP/source/$SOURCE_DIR/." .
          git add -A
          git commit -m "release: import JHoster v3.76.1 source tree"
          git push origin HEAD:"$TARGET_BRANCH" --force

      - name: Verify imported file count
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(git ls-files | wc -l | tr -d ' ')"
          echo "Imported tracked files: $COUNT"
          test "$COUNT" -eq 577
