# 📄 Dosya Yolu: E:\JHoster\modules\\community\\runtime\\node-22\\manifest.yml
# 📌 Amac: Node.js Runtime kurulum planini tanimlar
# 📌 Modul - YAML
# Version: 1.3.0
# Aciklama: Guvenli executor destekli plan only ve service adapter ve runtime family manifest dosyasi
# Bagimli Oldugu Katman: Config

package:
  code: node-22
  name: Node.js Runtime
  version: 22
  category: runtime
  edition: community
  description: Node.js Runtime icin plan only runtime tanimi

requirements:
  os:
    - windows
  arch:
    - x64

installer:
  mode: plan_only
  cache_dir: cache/runtime/node/22
  runtime_adapter: node
  runtime_family: node
  target_dir: apps/runtime/node/22

actions:
  - type: check
    name: check_executor_policy
    command: echo Checking executor policy
  - type: ensure_directory
    name: ensure_cache_directory
    target: cache/runtime/node/22
  - type: ensure_directory
    name: ensure_target_directory
    target: apps/runtime/node/22
  - type: download
    name: download_archive
    source: official_url_pending
    target: cache/runtime/node/22/node.zip
  - type: extract
    name: extract_archive
    source: cache/runtime/node/22/node.zip
    target: apps/runtime/node/22
  - type: write_file
    name: write_runtime_marker
    target: apps/runtime/node/22/jhoster.runtime
    content: node-22 runtime registered
