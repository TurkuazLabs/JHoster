# 📄 Dosya Yolu: E:\JHoster\modules\\community\\runtime\\php-8.3\\manifest.yml
# 📌 Amac: PHP Runtime kurulum planini tanimlar
# 📌 Modul - YAML
# Version: 1.3.0
# Aciklama: Guvenli executor destekli plan only ve service adapter ve runtime family manifest dosyasi
# Bagimli Oldugu Katman: Config

package:
  code: php-8.3
  name: PHP Runtime
  version: 8.3
  category: runtime
  edition: community
  description: PHP Runtime icin plan only runtime tanimi

requirements:
  os:
    - windows
  arch:
    - x64

installer:
  mode: plan_only
  cache_dir: cache/runtime/php/8.3
  runtime_adapter: php
  runtime_family: php
  target_dir: apps/runtime/php/8.3

actions:
  - type: check
    name: check_executor_policy
    command: echo Checking executor policy
  - type: ensure_directory
    name: ensure_cache_directory
    target: cache/runtime/php/8.3
  - type: ensure_directory
    name: ensure_target_directory
    target: apps/runtime/php/8.3
  - type: download
    name: download_archive
    source: official_url_pending
    target: cache/runtime/php/8.3/php.zip
  - type: extract
    name: extract_archive
    source: cache/runtime/php/8.3/php.zip
    target: apps/runtime/php/8.3
  - type: write_file
    name: write_runtime_marker
    target: apps/runtime/php/8.3/jhoster.runtime
    content: php-8.3 runtime registered
