# 📄 Dosya Yolu: E:\JHoster\modules\\community\\runtime\\mysql-8.4\\manifest.yml
# 📌 Amac: MySQL Runtime kurulum planini tanimlar
# 📌 Modul - YAML
# Version: 1.3.0
# Aciklama: Guvenli executor destekli plan only ve service adapter ve runtime family manifest dosyasi
# Bagimli Oldugu Katman: Config

package:
  code: mysql-8.4
  name: MySQL Runtime
  version: 8.4
  category: runtime
  edition: community
  description: MySQL Runtime icin plan only runtime tanimi

requirements:
  os:
    - windows
  arch:
    - x64

installer:
  mode: plan_only
  cache_dir: cache/runtime/mysql/8.4
  runtime_adapter: mysql
  runtime_family: mysql
  target_dir: apps/runtime/mysql/8.4

actions:
  - type: check
    name: check_executor_policy
    command: echo Checking executor policy
  - type: ensure_directory
    name: ensure_cache_directory
    target: cache/runtime/mysql/8.4
  - type: ensure_directory
    name: ensure_target_directory
    target: apps/runtime/mysql/8.4
  - type: download
    name: download_archive
    source: official_url_pending
    target: cache/runtime/mysql/8.4/mysql.zip
  - type: extract
    name: extract_archive
    source: cache/runtime/mysql/8.4/mysql.zip
    target: apps/runtime/mysql/8.4
  - type: write_file
    name: write_runtime_marker
    target: apps/runtime/mysql/8.4/jhoster.runtime
    content: mysql-8.4 runtime registered
